# ==============================================================================
# Mini Sales ETL — Apache Airflow 3.3.1 (LocalExecutor) + PostgreSQL warehouse
#
# ดัดแปลงจาก docker-compose.yaml ทางการของ Airflow โดย:
#   - เปลี่ยน CeleryExecutor -> LocalExecutor (ตัด redis / worker / flower ออก)
#   - เพิ่ม service "warehouse" = PostgreSQL ปลายทางที่เก็บข้อมูลยอดขายของเรา
#   - ตั้ง Connection "postgres_dw" ผ่าน environment variable (ไม่ต้องคลิกตั้งใน UI)
#
# กล่อง (container) ที่จะรัน:
#   postgres              metadata DB ของ Airflow เอง  (ไม่ใช่ข้อมูลเรา)
#   warehouse             PostgreSQL ของเรา  -> เปิดจากเครื่อง host ที่ localhost:5433
#   airflow-apiserver     หน้าเว็บ  -> http://localhost:8080  (user/pass: airflow/airflow)
#   airflow-scheduler     ตัวจับเวลา/สั่งรัน task
#   airflow-dag-processor ตัวอ่านไฟล์ใน dags/
#   airflow-triggerer     จัดการ task แบบรอ event (ไม่ได้ใช้ในโปรเจกต์นี้ แต่ Airflow 3 ต้องมี)
#   airflow-init          รันครั้งเดียวตอนแรก: สร้างตาราง metadata + user
# ==============================================================================
---
x-airflow-common:
  &airflow-common
  build: .                      # ใช้ Dockerfile ในโฟลเดอร์นี้ (image ทางการ + pandas)
  env_file:
    - .env
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'          # ไม่โหลด DAG ตัวอย่างของ Airflow ให้รก
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
    # Connection ที่ DAG ใช้: conn_id = "postgres_dw"
    # รูปแบบ AIRFLOW_CONN_<CONN_ID ตัวพิมพ์ใหญ่> = URI
    # host = "warehouse" คือชื่อ service ด้านล่าง (container คุยกันด้วยชื่อ service ไม่ใช่ localhost)
    AIRFLOW_CONN_POSTGRES_DW: 'postgres://etl:etl@warehouse:5432/warehouse'
  volumes:
    - ./dags:/opt/airflow/dags          # ไฟล์ DAG
    - ./include:/opt/airflow/include    # CSV + ไฟล์ SQL
    - ./logs:/opt/airflow/logs
    - ./config:/opt/airflow/config
    - ./plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy
    warehouse:
      condition: service_healthy

services:
  # ---------- metadata DB ของ Airflow ----------
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # ---------- data warehouse ของเรา ----------
  # ต่อจากเครื่อง host (DBeaver/pgAdmin): host=localhost port=5433 user=etl password=etl db=warehouse
  warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: etl
      POSTGRES_DB: warehouse
    ports:
      - "5433:5432"
    volumes:
      - warehouse-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "etl", "-d", "warehouse"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # ---------- Airflow ----------
  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # รันครั้งเดียว: migrate metadata DB + สร้าง user สำหรับ login หน้าเว็บ
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        /entrypoint airflow version
        /entrypoint airflow config list >/dev/null
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,plugins,config}
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    user: "0:0"

  # ใช้พิมพ์คำสั่ง airflow cli:  docker compose run --rm airflow-cli airflow dags list
  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    command:
      - bash
      - -c
      - airflow

volumes:
  postgres-db-volume:
  warehouse-db-volume:
